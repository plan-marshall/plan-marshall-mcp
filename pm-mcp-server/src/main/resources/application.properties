quarkus.application.name=pm-mcpd

# Local listener: HTTP/1.1 on the Unix domain socket only, no TCP listener
# (plan-marshall-documentation: doc/specification/runtime-model/01-processes-and-transport.adoc, Transport Endpoint).
# quarkus.http.domain-socket is set at runtime by PmMcpd from PM_MCP_BASE (system property).
quarkus.http.host-enabled=false
quarkus.http.domain-socket-enabled=true
quarkus.http.insecure-requests=enabled
quarkus.management.enabled=false
# Unix domain sockets in Vert.x need the Netty native transport (kqueue on macOS, epoll on Linux)
quarkus.vertx.prefer-native-transport=true

# MCP Streamable HTTP endpoint at /mcp
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=plan-marshall-mcp
quarkus.mcp.server.tools.input-validation-error=TOOL
# Requests of a session-opening host (protocol 2025-11-25) without Mcp-Session-Id are served on a
# per-request connection; the relay never sends a session id back
quarkus.mcp.server.http.streamable.auto-init=true
# Only the relay and the local clients reach /mcp; there is no browser on the socket
quarkus.mcp.server.http.dns-rebinding-check.enabled=false

# Every request is authenticated (runtime token, job token on /mcp, device secret on the web listener)
quarkus.http.auth.proactive=true
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Native image: the core tool schemas and the packaged operator web app are read from the classpath
quarkus.native.resources.includes=pm-mcp/tools/*.json,META-INF/resources/**

# Logging
quarkus.log.level=INFO
quarkus.log.category."de.planmarshall".level=INFO

# Tests: the McpAssured client speaks TCP only, so the test profile adds a loopback TCP listener beside
# the socket; the socket path and PM_MCP_BASE come from the test resource (RuntimeBaseResource)
%test.quarkus.http.host-enabled=true
%test.quarkus.http.host=127.0.0.1
%test.quarkus.http.test-port=0

# Test coverage: quarkus-jacoco writes into the Maven JaCoCo data file, so the Sonar report
# (-Pcoverage) contains both @QuarkusTest and plain unit-test coverage
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
