# Example: Copy this to your repo as .github/workflows/maven.yml
# Configuration is read from .github/project.yml - no inputs needed!
name: Maven Build

on:
  # Required so the 'build / conclusion' status check runs on the merge-queue
  # branch; without it, queued PRs stay CLEAN but never merge (queue times out).
  merge_group:
  push:
    branches: [main, "release/*", "dependabot/**"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read        # the conclusion job verifies a covering run exists

jobs:
  build:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-maven-build.yml@3e1ecafb6a194fe22fc6a9bfdc2a41c81584f989 # v0.43.0
    # No publishing credentials: plan-marshall-mcp publishes nothing to external repositories.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
